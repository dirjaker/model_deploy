<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model Deploy - Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--accent:#58a6ff;--text:#c9d1d9;--muted:#8b949e;--green:#3fb950;--red:#f85149;--orange:#d29922;--radius:8px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#0d1117 0%,#161b22 100%);border-bottom:1px solid var(--border);padding:20px 32px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:22px;font-weight:600;color:var(--accent)}
.header .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.header .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.container{max-width:1200px;margin:0 auto;padding:24px 32px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center}
.stat-card .value{font-size:36px;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:13px;color:var(--muted);margin-top:4px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:768px){.grid-2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h2{font-size:16px;font-weight:600;color:var(--accent);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent)}
.btn{padding:8px 20px;border:none;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{opacity:.85}
.btn-sm{padding:4px 12px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
.status-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.status-ready{background:rgba(63,185,80,.15);color:var(--green)}
.status-loading{background:rgba(210,153,34,.15);color:var(--orange)}
.status-error{background:rgba(248,81,73,.15);color:var(--red)}
.chat-box{display:flex;flex-direction:column;gap:8px}
.chat-input-row{display:flex;gap:8px}
.chat-input-row input{flex:1}
.chat-messages{max-height:300px;overflow-y:auto;padding:8px;background:var(--bg);border-radius:6px;border:1px solid var(--border);min-height:100px}
.msg{margin-bottom:8px;padding:8px 12px;border-radius:6px;font-size:14px}
.msg-user{background:rgba(88,166,255,.1);border-left:3px solid var(--accent)}
.msg-ai{background:rgba(63,185,80,.1);border-left:3px solid var(--green)}
.msg .role{font-size:11px;color:var(--muted);margin-bottom:2px}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.log-area{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;font-family:'SF Mono','Fira Code',monospace;font-size:12px;max-height:200px;overflow-y:auto;color:var(--muted)}
</style>
</head>
<body>

<div class="header">
  <h1>Model Deploy</h1>
  <div class="status"><div class="dot" id="statusDot"></div><span id="statusText">Connecting...</span></div>
</div>

<div class="container">
  <div class="stats" id="statsGrid">
    <div class="stat-card"><div class="value" id="loadedModels">0</div><div class="label">Loaded Models</div></div>
    <div class="stat-card"><div class="value" id="gpuTotal">--</div><div class="label">GPU Memory Total (GB)</div></div>
    <div class="stat-card"><div class="value" id="gpuUsed">--</div><div class="label">GPU Memory Used (GB)</div></div>
    <div class="stat-card"><div class="value" id="totalRequests">0</div><div class="label">Total Requests</div></div>
  </div>

  <div class="grid-2">
    <div class="card">
      <h2>Load Model</h2>
      <div class="form-group"><label>Model Name</label><input id="loadName" placeholder="e.g. qwen-7b-chat"></div>
      <div class="form-group"><label>Model Path</label><input id="loadPath" placeholder="HuggingFace ID or local path" value="local-model"></div>
      <div class="form-group"><label>Format</label>
        <select id="loadFormat"><option value="pytorch">PyTorch</option><option value="gptq">GPTQ</option><option value="awq">AWQ</option><option value="gguf">GGUF</option></select>
      </div>
      <div class="form-group"><label>Quantization</label>
        <select id="loadQuant"><option value="none">None</option><option value="gptq">GPTQ</option><option value="awq">AWQ</option><option value="gguf">GGUF</option></select>
      </div>
      <button class="btn btn-primary" onclick="loadModel()">Load Model</button>
    </div>

    <div class="card">
      <h2>Chat Test</h2>
      <div class="form-group"><label>Model</label><input id="chatModel" placeholder="Model name to test"></div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row" style="margin-top:8px">
        <input id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn btn-primary" onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Loaded Models</h2>
    <table>
      <thead><tr><th>Name</th><th>Path</th><th>Format</th><th>GPU (GB)</th><th>Max Length</th><th>Status</th><th>Action</th></tr></thead>
      <tbody id="modelsTable"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Activity Log</h2>
    <div class="log-area" id="logArea">Waiting for activity...</div>
  </div>
</div>

<script>
const API = '';

function log(msg) {
  const el = document.getElementById('logArea');
  const ts = new Date().toLocaleTimeString();
  el.innerHTML += `<div>[${ts}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

async function fetchStatus() {
  try {
    const r = await fetch(API + '/api/system/status');
    if (!r.ok) return;
    const d = await r.json();
    document.getElementById('loadedModels').textContent = d.models_loaded;
    document.getElementById('gpuTotal').textContent = d.gpu_memory_total.toFixed(1);
    document.getElementById('gpuUsed').textContent = d.gpu_memory_used.toFixed(1);
    document.getElementById('totalRequests').textContent = d.total_requests;
    document.getElementById('statusDot').style.background = '#3fb950';
    document.getElementById('statusText').textContent = 'Service Running';
  } catch (e) {
    document.getElementById('statusDot').style.background = '#f85149';
    document.getElementById('statusText').textContent = 'Disconnected';
  }
}

async function fetchModels() {
  try {
    const r = await fetch(API + '/api/models');
    const models = await r.json();
    const tbody = document.getElementById('modelsTable');
    tbody.innerHTML = '';
    models.forEach(m => {
      const cls = m.is_loaded ? 'status-ready' : 'status-error';
      const label = m.is_loaded ? 'Ready' : 'Unloaded';
      tbody.innerHTML += `<tr>
        <td>${m.model_name}</td><td>${m.model_path}</td><td>${m.model_format}</td>
        <td>${m.gpu_memory_used.toFixed(1)}</td><td>${m.max_model_len}</td>
        <td><span class="status-badge ${cls}">${label}</span></td>
        <td><button class="btn btn-danger btn-sm" onclick="unloadModel('${m.model_name}')">Unload</button></td>
      </tr>`;
    });
  } catch (e) {}
}

async function loadModel() {
  const name = document.getElementById('loadName').value.trim();
  if (!name) return alert('Please enter model name');
  const body = {
    model_name: name,
    model_path: document.getElementById('loadPath').value.trim() || 'local-model',
    model_format: document.getElementById('loadFormat').value,
    quantization: document.getElementById('loadQuant').value,
  };
  log(`Loading model: ${name}...`);
  try {
    const r = await fetch(API + '/api/models/load', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const d = await r.json();
    if (r.ok) { log(`Model ${name} loaded successfully`); } else { log(`Error: ${d.detail}`); }
    fetchModels(); fetchStatus();
  } catch (e) { log(`Error: ${e.message}`); }
}

async function unloadModel(name) {
  log(`Unloading model: ${name}...`);
  try {
    const r = await fetch(API + `/api/models/${name}/unload`, {method:'POST'});
    const d = await r.json();
    if (r.ok) { log(`Model ${name} unloaded`); } else { log(`Error: ${d.detail}`); }
    fetchModels(); fetchStatus();
  } catch (e) { log(`Error: ${e.message}`); }
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;
  const model = document.getElementById('chatModel').value.trim();
  if (!model) return alert('Please enter model name');
  const messages = document.getElementById('chatMessages');
  messages.innerHTML += `<div class="msg msg-user"><div class="role">User</div>${msg}</div>`;
  input.value = '';
  try {
    const r = await fetch(API + '/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({model, message:msg})});
    const d = await r.json();
    if (r.ok) {
      messages.innerHTML += `<div class="msg msg-ai"><div class="role">Assistant</div>${d.response}</div>`;
    } else {
      messages.innerHTML += `<div class="msg msg-ai" style="border-left-color:#f85149"><div class="role">Error</div>${d.detail}</div>`;
    }
  } catch (e) {
    messages.innerHTML += `<div class="msg msg-ai" style="border-left-color:#f85149"><div class="role">Error</div>${e.message}</div>`;
  }
  messages.scrollTop = messages.scrollHeight;
}

setInterval(() => { fetchStatus(); fetchModels(); }, 5000);
fetchStatus();
fetchModels();
</script>
</body>
</html>
